<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoCurr Course Folder</title>
  <link rel="stylesheet" href="newcourse.css">
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;700&display=swap" rel="stylesheet">
</head>
<style>       
</style>
<body>
  <div class="container">

    <!-- Background Rectangle -->
    <div id="bgRect"></div>

    <!-- Sidebar -->
    <div class="sidebar">
      <img src="images/task-icon.svg" alt="Tasks" class="sidebar-icon">
      <img src="images/calendar-icon.svg" alt="Calendar" class="sidebar-icon">
      <img src="images/folder-icon.svg" alt="Course" class="sidebar-icon">
    </div>

    <!-- Logo -->
    <div class="cocurr-logo"></div>

    <!-- Big Folder Icon -->
    <div class="big-folder-icon"></div>
    <!-- Profile circle (top-right) -->
    <div id="profileCircle">T</div>

    <!-- Course Header Section -->
    <div class="course-header-section">
      <div class="course-header-top">
        <div class="course-info-left">
          <label for="courseName">Course Name</label>
          <input type="text" id="courseName" placeholder="Enter course name" class="course-name-input">
          <label for="courseDescription">Course Description</label>
          <textarea id="courseDescription" placeholder="Enter course description" class="course-description-input" rows="4"></textarea>
        </div>
        <div class="course-info-middle">
          <label>Schedule - Days</label>
          <div class="days-picker">
            <label class="day-checkbox"><input type="checkbox" value="Monday"> Mon</label>
            <label class="day-checkbox"><input type="checkbox" value="Tuesday"> Tue</label>
            <label class="day-checkbox"><input type="checkbox" value="Wednesday"> Wed</label>
            <label class="day-checkbox"><input type="checkbox" value="Thursday"> Thu</label>
            <label class="day-checkbox"><input type="checkbox" value="Friday"> Fri</label>
            <label class="day-checkbox"><input type="checkbox" value="Saturday"> Sat</label>
            <label class="day-checkbox"><input type="checkbox" value="Sunday"> Sun</label>
          </div>
          <label for="scheduleTime">Schedule - Time</label>
          <input type="time" id="scheduleTime" class="schedule-time-input">
        </div>
        <div class="course-info-right">
          <button id="confirmBtn" class="confirm-btn">Confirm</button>
          <label for="teacherName">Instructor</label>
          <input type="text" id="teacherName" placeholder="Enter instructor name" class="teacher-input">
        </div>
      </div>
    </div>

    <!-- Table Headers -->
    <div class="table-headers">
      <div class="header check-header"></div>
      <div class="header task-header">Tasks</div>
      <div class="header deadline-header">Deadline</div>
      <div class="header status-header">Status</div>
      <div class="header course-header">Course</div>
      <div class="header actions-header"></div>
    </div>

    
    <!-- Task Table -->
    <div class="task-table" id="task-table">
      <div class="task-row add-row">
        <div class="plus-btn">+</div>
      </div>
    </div>

  </div>

  <script src="newcourse.js"></script>
</body>
</html>
